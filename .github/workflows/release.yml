name: Release

# Tag a commit on main (`git tag v1.0 && git push origin v1.0`) to publish a signed APK and AAB.
# Requires four repository secrets; see README "Releasing".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches versionName
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::missing repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Stage keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Unit tests
        run: sh gradlew :app:testDebugUnitTest

      - name: Lint
        run: sh gradlew :app:lintDebug

      - name: Build signed APK and AAB
        run: sh gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab > /dev/null
          echo "APK and AAB both carry the release signature"

      - name: Remove keystore
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/diskquilt-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/diskquilt-${GITHUB_REF_NAME}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DiskQuilt ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
