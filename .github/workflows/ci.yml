name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails the run before anything is built if a credential or a keystore slipped in.
      - name: Secret check
        run: sh tools/check-secrets.sh --all

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes `tools`, which no longer exists and
          # makes sdkmanager exit 1. We install the real packages in the next step.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Wrapper is committed but its exec bit is not portable across clones, so call it via sh.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: sh gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: sh gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: sh gradlew --no-daemon :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diskquilt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
