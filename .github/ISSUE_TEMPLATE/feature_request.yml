name: Feature request
description: Suggest a capability or a change in behaviour
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DiskQuilt aims to stay small: a scanner, a treemap, a file list. Features that add a
        permission, a background service or a network dependency need a strong justification.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I cannot tell which folder grew" beats "add a chart".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including anything you already tried in DiskQuilt, or other tools.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning / accuracy
        - Treemap
        - File list / search / filters
        - Deleting or selecting files
        - Deep scan (Android/data, Android/obb)
        - Settings / appearance
        - Build, release or CI
    validations:
      required: true
