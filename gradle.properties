org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Gradle 8.11.1's VFS watcher deadlocks in lint analysis when the project path contains a
# space (Windows). release lint then sits at 0% CPU forever; see README "Troubleshooting".
# Watching is only an optimisation: without it changes are detected on the next build.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
